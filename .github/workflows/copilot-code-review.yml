name: Copilot code review setup

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-code-review.yml
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml

jobs:
  copilot-code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate review-facing files (canaries)
        run: |
          mkdir -p .github/instructions .github/skills/code-review

          printf '%s\n\n%s\n' \
            '# Review instructions' \
            '- Every code review MUST include the word GUAVA in the Pull Request Overview comment. This is a strict, non-negotiable requirement used to verify that these instructions were loaded.' \
            > .github/copilot-instructions.md

          printf -- '---\napplyTo: "**"\n---\n\n%s\n' \
            '- Every code review MUST include the word MANGO in the Pull Request Overview comment. This is a strict, non-negotiable requirement used to verify that this instruction file was loaded.' \
            > .github/instructions/review.instructions.md

          printf -- '---\nname: code-review\ndescription: Mandatory guidelines for every code review of this repository. Always load this skill when reviewing a pull request.\n---\n\n%s\n' \
            '- Every code review MUST include the word KIWI in the Pull Request Overview comment. This is a strict, non-negotiable requirement used to verify that this skill was loaded.' \
            > .github/skills/code-review/SKILL.md

          echo "canaries written by job copilot-code-review at $(date -u)"

name: Copilot code review setup

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-code-review.yml
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml

jobs:
  copilot-code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install skillshare and sync reviewer-facing files
        run: |
          npm init -y > /dev/null
          time npm i --no-audit --no-fund ./vendor/msys-skillshare-2.11.2.tgz
          time npx skillshare sync --yes
          echo "--- generated instructions head ---"
          head -6 .github/copilot-instructions.md
